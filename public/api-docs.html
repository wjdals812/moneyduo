<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MoneyDuo API 문서</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css" />
  <style>
    #guide { font: 14px/1.6 system-ui, sans-serif; padding: 16px 20px; background: #f6f8fa; border-bottom: 1px solid #d0d7de; }
    #guide button { padding: 6px 12px; cursor: pointer; }
    #guide input { width: min(520px, 90%); margin-top: 8px; font-family: monospace; }
  </style>
</head>
<body>
  <div id="guide">
    <b>직접 호출해 보기</b><br />
    ① <button id="tok">테스트 토큰 발급</button> (익명 계정, 약 1시간 유효) → 자동으로 Authorize에 적용됩니다.<br />
    ② 아래에서 API를 펼쳐 <b>Try it out → Execute</b>를 누르세요. 생성 → 참여 → 해제 순서로 확인할 수 있습니다.
    <div id="msg"></div>
    <input id="tokval" readonly hidden />
  </div>
  <div id="ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    const ui = SwaggerUIBundle({ url: '/openapi.yaml', dom_id: '#ui' })
    // Firebase 웹 apiKey는 앱 번들에도 공개되는 값이다
    const FIREBASE_API_KEY = 'AIzaSyAT0QoZqp6UKA29_ja6-TA6cnHXEpG4t5c'
    const msg = document.getElementById('msg')
    document.getElementById('tok').onclick = async () => {
      msg.textContent = '발급 중...'
      try {
        const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FIREBASE_API_KEY}`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ returnSecureToken: true }),
        })
        const { idToken } = await r.json()
        if (!idToken) throw new Error('토큰을 받지 못했어요')
        ui.preauthorizeApiKey('bearerAuth', idToken)
        const box = document.getElementById('tokval')
        box.value = idToken; box.hidden = false
        msg.textContent = '✅ 토큰이 적용됐어요. 이제 Try it out을 사용할 수 있어요. (적용이 안 되면 아래 값을 Authorize에 붙여 넣으세요)'
      } catch (e) {
        msg.textContent = '❌ ' + e.message
      }
    }
  </script>
</body>
</html>
